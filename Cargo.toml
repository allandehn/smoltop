[package]
name = "smoltop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A small terminal UI for managing smolvm microVMs"
readme = "README.md"
repository = "https://github.com/allandehn/smoltop"
authors = ["Allan"]

[dependencies]
crossterm = "0.28"
ratatui = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.19"
